# Every push and pull request: the full backend test suite (unit, persistence and API integration —
# Testcontainers runs on GitHub's Ubuntu runners), the frontend's lint/format/unit tests/build, and a
# Bicep compile check (spec 013 story 8).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test tests/ClaimsModule.UnitTests --no-build --configuration Release
      - name: Persistence tests (Testcontainers SQL Server)
        run: dotnet test tests/ClaimsModule.PersistenceTests --no-build --configuration Release
      - name: API integration tests (Testcontainers SQL Server + Azurite)
        run: dotnet test tests/ClaimsModule.ApiIntegrationTests --no-build --configuration Release

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --watch=false
      - run: npx ng build

  infra:
    name: Bicep compiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
