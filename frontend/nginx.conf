server {
  listen 80;
  root /usr/share/nginx/html;

  # The API and locally stored documents are served from the same origin as the SPA.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    client_max_body_size 60m; # matches the API's request size limit for document uploads
  }

  location /uploads/ {
    proxy_pass http://api:8080;
  }

  # Runtime config must never be cached — it is what makes one build promotable across environments.
  location = /assets/config.json {
    add_header Cache-Control "no-store";
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
