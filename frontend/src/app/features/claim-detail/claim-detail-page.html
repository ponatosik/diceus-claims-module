@if (store.claim()) {
  <div class="detail">
    <app-claim-header />

    <section class="tabs-card">
      @if (store.loading()) {
        <mat-progress-bar mode="indeterminate" class="loading-bar" />
      }
      <mat-tab-group
        [selectedIndex]="selectedIndex()"
        (selectedIndexChange)="selectTab($event)"
        animationDuration="0ms"
        mat-stretch-tabs="false"
      >
        <mat-tab label="Overview"
          ><div class="tab-body"><app-claim-overview-tab /></div
        ></mat-tab>
        <mat-tab label="Parties"
          ><div class="tab-body"><app-claim-parties-tab /></div
        ></mat-tab>
        <mat-tab label="Reserves">
          <!-- Lazy: reserves load (and polling starts) only once the tab is opened. -->
          <ng-template matTabContent>
            <div class="tab-body"><app-claim-reserves-tab [highlight]="highlight()" /></div>
          </ng-template>
        </mat-tab>
        <mat-tab label="Documents">
          <ng-template matTabContent>
            <div class="tab-body"><app-claim-documents-tab [highlight]="highlight()" /></div>
          </ng-template>
        </mat-tab>
        <mat-tab label="Audit Log">
          <ng-template matTabContent>
            <div class="tab-body"><app-claim-audit-tab /></div>
          </ng-template>
        </mat-tab>
      </mat-tab-group>
    </section>
  </div>
} @else if (store.loadFailed()) {
  <p class="message">This claim couldn't be loaded.</p>
} @else {
  <app-skeleton [lines]="10" />
}
